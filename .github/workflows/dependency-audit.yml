name: dependency-audit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Require workerman and webman release tags
        run: php bin/ci/check-release-tags.php

      - name: Reject committed vendor trees
        working-directory: ${{ github.workspace }}
        run: |
          tracked="$(git ls-files -- 'vendor' 'server/vendor')"
          if [ -n "$tracked" ]; then
            echo "vendor trees must not be committed"
            printf '%s\n' "$tracked"
            exit 1
          fi

  frontend-prod-audit:
    name: frontend prod audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandadmin-artd
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sandadmin-artd/pnpm-lock.yaml

      # Production scope is `pnpm audit --prod`: dependencies and
      # optionalDependencies. devDependencies (Vite, ESLint, TypeScript,
      # Tailwind) are build tooling and are outside this gate.
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod

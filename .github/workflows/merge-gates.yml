# 1.x 合并前门禁·快档（v4 T-8 / L-1 / U-6 / R-8）：直接调用
# tools/pre-merge.sh --fast，本地和 CI 是同一套命令——红了先在本地
# 跑 tools/pre-merge.sh --fast 复现再改，别只在 CI 上猜。
# 快档内容（步序见脚本）：php -l、危险函数白名单扫描、TypePHP 禁用
# 写法 diff 扫描、strict types、PHPStan、deptrac 依赖方向、命名自查、
# 基线只减不增、前端三道（tsc/eslint/vitest）、PHPUnit unit 套件，
# 挂在 PR 与所有分支推送上，全过才允许合并。
# 慢档（PHPUnit 三库矩阵、依赖审计、e2e 槽位）在 merge-gates-slow.yml，
# 只在 main 推送、每日定时与手动触发上跑。
name: merge-gates

on:
  pull_request:
    branches: [main]
  # 所有分支推送都跑快档：提交即反馈，慢档只挂 main（见 merge-gates-slow.yml）。
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  pre-merge:
    name: 快档：pre-merge --fast（本地同一套门禁）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 命名 diff 与基线只减不增要对 origin/main 做三点比对，需要全历史。
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2
          coverage: none

      # 脚本前置：vendor/bin/phpstan|phpunit|deptrac；server/plugin/ 由
      # composer install 的 sand:publish 发布出来，deptrac 才能扫到。
      - name: Install PHP dependencies
        run: cd server && composer install --no-interaction --prefer-dist

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/ 的 pnpm install 在脚本内部跑（--frozen-lockfile），这里不重复装。
      - name: pre-merge --fast
        run: tools/pre-merge.sh --fast

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SandAdmin favicon</title>
  <desc id="desc">A bold gradient S inside a cyan hexagon on a transparent background.</desc>
  <defs>
    <linearGradient id="hexGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73F7F1"/>
      <stop offset="0.48" stop-color="#21C8F6"/>
      <stop offset="1" stop-color="#168BE7"/>
    </linearGradient>
    <linearGradient id="sGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73EEE4"/>
      <stop offset="0.22" stop-color="#F6C65C"/>
      <stop offset="0.52" stop-color="#C77BEA"/>
      <stop offset="0.78" stop-color="#F0A83F"/>
      <stop offset="1" stop-color="#FFD875"/>
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent canvas: no background rectangle. -->
  <path d="M256 27 450 139 450 373 256 485 62 373 62 139Z"
        fill="none" stroke="#071725" stroke-width="58" stroke-linejoin="round"/>
  <path d="M256 27 450 139 450 373 256 485 62 373 62 139Z"
        fill="none" stroke="url(#hexGradient)" stroke-width="38" stroke-linejoin="round"
        filter="url(#hexGlow)"/>

  <path d="M356 132 C292 84 154 103 151 184 C147 250 350 246 354 329 C358 411 228 440 150 389"
        fill="none" stroke="#081525" stroke-opacity="0.92" stroke-width="132"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356 132 C292 84 154 103 151 184 C147 250 350 246 354 329 C358 411 228 440 150 389"
        fill="none" stroke="url(#sGradient)" stroke-width="104"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#sGlow)"/>
</svg>

components:
  schemas:
    Envelope:
      type: object
      properties:
        code:       {type: string, description: 成功固定 OK；失败为 x-error-catalog 登记的码}
        message:    {type: string}
        data:       {}
        fields:     {type: object, additionalProperties: {type: array, items: {type: string}}}
        request_id: {type: string}
      required: [code, request_id]

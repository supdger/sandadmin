openapi: 3.1.0
info:
  title: SandAdmin 1.x 管理接口
  version: "1.0"
  description: >-
    唯一契约权威。路由表、权限注册表、MCP 工具表、错误码注册表、TS 类型、
    测试骨架均由 tools/contract-build 从本文件（加插件片段）生成。
    人读约定见 contract/api-conventions.md。

# ── 错误码总表：code → {http_status, summary}
# common: true 的四个通用码接口不用逐个声明；业务码才写进 x-error-codes。
x-error-catalog:
  VALIDATION_FAILED:   {http_status: 422, summary: 请求内容有误，请按提示修改, common: true, note: 装配层部分路径按 400 返回，取值语义不变}
  UNAUTHENTICATED:     {http_status: 401, summary: 请先登录, common: true}
  PERMISSION_DENIED:   {http_status: 403, summary: 你没有权限做这个操作, common: true}
  INTERNAL_ERROR:      {http_status: 500, summary: 系统出了点问题，请稍后再试, common: true}
  SESSION_EXPIRED:     {http_status: 401, summary: 会话过期或已吊销（B2 链预留）}
  NOT_FOUND:           {http_status: 404, summary: 要找的内容不存在或已被删除}
  IDEMPOTENCY_KEY_REUSED: {http_status: 409, summary: 相同请求标识被用于不同内容}
  FILE_NOT_FOUND:      {http_status: 404, summary: 文件不存在}
  FILE_TOO_LARGE:      {http_status: 413, summary: 文件超过 100MB 上限}
  FILE_TYPE_NOT_ALLOWED: {http_status: 422, summary: 这种文件类型不支持上传}
  USER_NOT_FOUND:      {http_status: 404, summary: 用户不存在}
  USERNAME_TAKEN:      {http_status: 409, summary: 这个账号已经被使用了}
  USER_DISABLE_BLOCKED: {http_status: 409, summary: 停用被阻断（有未完成交接或依赖）}
  DEPT_NOT_FOUND:      {http_status: 404, summary: 部门不存在}
  DEPT_NAME_TAKEN:     {http_status: 409, summary: 同一上级下已经有同名部门了}
  DEPT_NOT_EMPTY:      {http_status: 409, summary: 部门非空不能删}
  DEPT_REQUIRED:       {http_status: 422, summary: 请选择这个角色能查看的部门}
  POST_NOT_FOUND:      {http_status: 404, summary: 岗位不存在}
  POST_NAME_TAKEN:     {http_status: 409, summary: 这个岗位名称已经有人用了}
  ROLE_NAME_TAKEN:     {http_status: 409, summary: 这个角色名称已经有人用了}
  LAST_ADMIN:          {http_status: 409, summary: 系统里至少要留一个能用的超级管理员}
  SYSTEM_ROLE_READONLY: {http_status: 403, summary: 系统角色不能修改}
  STALE_VERSION:       {http_status: 409, summary: 这条刚被别人改过，刷新后再改}
  SELF_LOCKOUT:        {http_status: 403, summary: 不能移除你自己正在使用的权限}
  DATA_SCOPE_INVALID:  {http_status: 422, summary: 数据范围选择不正确}
  ANNOUNCEMENT_NOT_FOUND: {http_status: 404, summary: 公告不存在或对你不可见}
  MENU_NOT_FOUND:      {http_status: 404, summary: 要操作的菜单不存在或已被删除}
  MENU_LOCKED:         {http_status: 409, summary: 菜单被锁，不能这样操作}
  MENU_URL_INVALID:    {http_status: 422, summary: 链接地址不正确，只能是 http 或 https 开头}
  MENU_DEPTH_EXCEEDED: {http_status: 422, summary: 菜单最多两级，不能再往里放}
  DICT_TYPE_TAKEN:     {http_status: 409, summary: 这个分组名称已经存在了}
  DICT_ITEM_TAKEN:     {http_status: 409, summary: 这个选项已经存在了}
  TASK_NOT_FOUND:      {http_status: 404, summary: 要找的内容不存在或已被删除}
  TASK_RUN_NOT_FOUND:  {http_status: 404, summary: 任务不存在或已过期}
  TASK_RUN_NOT_DOWNLOADABLE: {http_status: 409, summary: 结果文件已过期或不存在}
  TASK_SCHEDULE_INVALID: {http_status: 422, summary: 执行时间填写不正确}
  LIFECYCLE_REQUEST_NOT_FOUND: {http_status: 404, summary: 申请不存在或无权查看}
  PLUGIN_NOT_FOUND:    {http_status: 404, summary: 插件不存在或已经被卸载}
  PLUGIN_ALREADY_INSTALLED: {http_status: 409, summary: 已经装好了}
  PLUGIN_NOT_INSTALLED: {http_status: 409, summary: 这个插件还没安装}
  PLUGIN_VERSION_INCOMPATIBLE: {http_status: 409, summary: 不能装比现在更旧的版本}
  PLUGIN_BUSY:         {http_status: 409, summary: 已有别的安装或升级在进行}
  PLUGIN_PACKAGE_INVALID: {http_status: 422, summary: 这个文件不是能用的安装包}
  PLUGIN_OPERATION_FORBIDDEN: {http_status: 403, summary: 只有超级管理员能安装和升级；编译版拒绝}
  SYSTEM_UPDATE_OPERATION_FORBIDDEN: {http_status: 403, summary: 系统更新被禁（编译版或开关关闭）}
  UPDATE_NOT_AVAILABLE: {http_status: 409, summary: 没有可升级项或已是最新}
  MCP_UNAUTHORIZED:    {http_status: 401, summary: 凭据无效或未配置}
  MCP_ORIGIN_REJECTED: {http_status: 403, summary: Origin 不在本机白名单}
  MCP_RATE_LIMITED:    {http_status: 429, summary: 调用频率超限}
  MCP_FORBIDDEN:       {http_status: 403, summary: 凭据没有工具需要的权限码}
  MCP_IDEMPOTENCY_REQUIRED: {http_status: 400, summary: 普通写工具必须带幂等键}
  MCP_HIGH_RISK_NOT_OPEN: {http_status: 403, summary: 高危写未开放，只能生成待确认请求}
  MCP_TOOL_FAILED:     {http_status: 500, summary: 工具执行失败}
  MCP_BAD_ARGUMENT:    {http_status: 400, summary: 工具参数不合法}
  MCP_TARGET_REJECTED: {http_status: 403, summary: 测试目标不在白名单}
  MCP_GATE_MISSING:    {http_status: 500, summary: tools/pre-merge.sh 不存在}

# ── 不挂在具体接口上的权限码（viewAll 等效码、MCP 凭据 scope）
x-permissions:
  - {code: system:task:index,   title: 查看全部后台任务,   note: TaskActor.viewAll 等效码}
  - {code: system:plugin:index, title: 查看全部插件申请,   note: LifecycleActor viewAll 等效码}
  - {code: system:update:index, title: 查看全部更新申请,   note: LifecycleActor viewAll 等效码}
  - {code: mcp:dev:routes,      title: dev 路由检查工具,   note: MCP 凭据 scope，不进权限树}
  - {code: mcp:dev:errors,      title: dev 错误摘要工具,   note: MCP 凭据 scope，不进权限树}
  - {code: mcp:dev:phpunit,     title: dev 跑测试工具,     note: MCP 凭据 scope，不进权限树}
  - {code: mcp:dev:gate,        title: dev 跑门禁工具,     note: MCP 凭据 scope，不进权限树}

# ── 权限树（顶掉 RoleService::MENUS；menu_key:action 拼成权限码）
x-permission-tree:
  - group_key: org
    group_title: 组织与用户
    menu_key: system:user
    title: 用户管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
      - {action: export, label: 导出}
      - {action: reset-password, label: 重置密码}
      - {action: assign-role, label: 分配角色}
  - group_key: org
    group_title: 组织与用户
    menu_key: system:dept
    title: 部门管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
  - group_key: org
    group_title: 组织与用户
    menu_key: system:post
    title: 岗位管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
  - group_key: org
    group_title: 组织与用户
    menu_key: system:role
    title: 角色与权限
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
      - {action: permission:update, label: 设置权限}
  - group_key: system
    group_title: 系统
    menu_key: system:menu
    title: 菜单管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
      - {action: reset, label: 恢复默认}
  # 说明：system:file/task/plugin/update 的码仍在注册表（路由与顶层 x-permissions
  # 声明），但按现状不进权限树——这些能力目前不可经角色配置授予。
  - group_key: data
    group_title: 数据管理
    menu_key: system:dict
    title: 选项管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
  - group_key: data
    group_title: 数据管理
    menu_key: system:announcement
    title: 公告管理
    actions:
      - {action: index, label: 查看}
      - {action: create, label: 添加}
      - {action: update, label: 编辑}
      - {action: delete, label: 删除}
      - {action: publish, label: 发布}
      - {action: revoke, label: 收回}

# ── 侧栏菜单 key（顶掉 MenuService 手写键；key 也是权限绑定键）
x-sidebar-menus:
  - {key: system:user,         title: 用户管理, icon: user,    path: /system/user}
  - {key: system:dept,         title: 部门管理, icon: dept,    path: /system/dept}
  - {key: system:post,         title: 岗位管理, icon: post,    path: /system/post}
  - {key: system:role,         title: 角色管理, icon: role,    path: /system/role}
  - {key: system:dict,         title: 选项管理, icon: dict,    path: /data/dict}
  - {key: system:announcement, title: 公告管理, icon: notice,  path: /data/notice}
  - {key: system:menu,         title: 菜单管理, icon: menu,    path: /system/menu}
  - {key: system:plugin,       title: 插件管理, icon: plugin,  path: /system/plugins}
  - {key: system:update,       title: 系统更新, icon: refresh, path: /system/update}

# ── 管理员高危码清单（顶掉 UserService::ADMIN_CODES）
x-admin-permissions:
  - system:user:create
  - system:user:update
  - system:user:reset-password
  - system:user:assign-role
  - system:role:permission:update

# ── 独立 MCP 工具（不绑 v1 接口，只许 dev_only:true）
x-mcp-tools:
  - name: dev_inspect_routes
    tier: read
    title: 路由与契约检查
    description: 读取当前路由表与契约文件（只读）
    permission: mcp:dev:routes
    dev_only: true
    input: {type: object, properties: {}, additionalProperties: false}
  - name: dev_recent_errors
    tier: read
    title: 最近错误与慢请求
    description: 摘读本地日志中的错误与慢请求记录（只读、脱敏）
    permission: mcp:dev:errors
    dev_only: true
    input:
      type: object
      properties:
        kind: {type: string, enum: [error, slow, all]}
        lines: {type: integer, minimum: 1, maximum: 200}
      additionalProperties: false
  - name: dev_run_phpunit
    tier: write
    title: 运行选定 PHPUnit 测试
    description: 按白名单目标运行 PHPUnit（tests/ 下路径或 Sandadmin\Tests\* 类名）
    permission: mcp:dev:phpunit
    dev_only: true
    input:
      type: object
      properties:
        target: {type: string}
      required: [target]
      additionalProperties: false
  - name: dev_run_pre_merge
    tier: write
    title: 运行快速门禁
    description: 执行 tools/pre-merge.sh --fast（固定命令，无参数）
    permission: mcp:dev:gate
    dev_only: true
    input:
      type: object
      properties: {}
      additionalProperties: false

# dev 说明：开发构建私有的 5 条免登录路由不进 paths——
# 契约面之外，继续在 route.php 哨兵段手写，由开发构建剔除。

paths:
  # ── 文件（app\controller\FileController）──
  /api/admin/v1/files:
    post:
      operationId: filesStore
      summary: 上传文件
      tags: [files]
      x-handler: 'app\controller\FileController::store'
      x-permission: authenticated
      x-error-codes: [FILE_TOO_LARGE, FILE_TYPE_NOT_ALLOWED, IDEMPOTENCY_KEY_REUSED]
      responses: {'200': {description: 契约信封}}
    get:
      operationId: filesIndex
      summary: 文件列表
      tags: [files]
      x-handler: 'app\controller\FileController::index'
      x-permission: system:file:index
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/files/{file_id}:
    get:
      operationId: filesShow
      summary: 文件详情
      tags: [files]
      x-handler: 'app\controller\FileController::show'
      x-permission: system:file:index
      x-error-codes: [FILE_NOT_FOUND]
      parameters:
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
    delete:
      operationId: filesDestroy
      summary: 删除文件
      tags: [files]
      x-handler: 'app\controller\FileController::destroy'
      x-permission: system:file:delete
      x-error-codes: [FILE_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/files/{file_id}/download:
    get:
      operationId: filesDownload
      summary: 下载文件
      description: 登录即可；私有文件仅上传人或持 system:file:index 者可下（属主判定在代码内）。
      tags: [files]
      x-handler: 'app\controller\FileController::download'
      x-permission: authenticated
      x-error-codes: [FILE_NOT_FOUND]
      parameters:
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 文件二进制流；失败仍为 JSON 信封}}
  /api/admin/v1/files/cleanup:
    post:
      operationId: filesCleanup
      summary: 清理无引用文件
      tags: [files]
      x-handler: 'app\controller\FileController::cleanup'
      x-permission: system:file:cleanup
      x-error-codes: [IDEMPOTENCY_KEY_REUSED]
      responses: {'200': {description: 契约信封（TaskAccepted）}}

  # ── 后台任务 ──
  /api/admin/v1/tasks:
    get:
      operationId: tasksIndex
      summary: 后台任务列表
      description: 登录即可；持 system:task:index 看全部，否则只看本人发起（属主判定在代码内）。
      tags: [tasks]
      x-handler: 'Sandadmin\Http\TaskController::index'
      x-permission: authenticated
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/tasks/{task_id}:
    get:
      operationId: tasksShow
      summary: 后台任务详情
      description: 同 tasksIndex 可见性；不可见与不存在同样 404。
      tags: [tasks]
      x-handler: 'Sandadmin\Http\TaskController::show'
      x-permission: authenticated
      x-error-codes: [TASK_RUN_NOT_FOUND]
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/tasks/{task_id}/download:
    get:
      operationId: tasksDownload
      summary: 下载任务结果文件
      description: 同 tasksIndex 可见性。
      tags: [tasks]
      x-handler: 'Sandadmin\Http\TaskController::download'
      x-permission: authenticated
      x-error-codes: [TASK_RUN_NOT_FOUND, TASK_RUN_NOT_DOWNLOADABLE]
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: 文件二进制流；失败仍为 JSON 信封}}

  # ── 公告 ──
  /api/admin/v1/me/announcements/popup:
    get:
      operationId: announcementsPopup
      summary: 当前登录人弹窗公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::popup'
      x-permission: authenticated
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements:
    get:
      operationId: announcementsIndex
      summary: 公告列表
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::index'
      x-permission: system:announcement:index
      responses: {'200': {description: 契约信封}}
    post:
      operationId: announcementsStore
      summary: 新建公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::store'
      x-permission: system:announcement:create
      x-error-codes: [IDEMPOTENCY_KEY_REUSED]
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements/{announcement_id}:
    get:
      operationId: announcementsShow
      summary: 公告详情
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::show'
      x-permission: system:announcement:index
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
    put:
      operationId: announcementsUpdate
      summary: 编辑公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::update'
      x-permission: system:announcement:update
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
    delete:
      operationId: announcementsDestroy
      summary: 删除公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::destroy'
      x-permission: system:announcement:delete
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements/{announcement_id}/publish:
    post:
      operationId: announcementsPublish
      summary: 发布公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::publish'
      x-permission: system:announcement:publish
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements/{announcement_id}/revoke:
    post:
      operationId: announcementsRevoke
      summary: 收回公告
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::revoke'
      x-permission: system:announcement:revoke
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements/{announcement_id}/read:
    post:
      operationId: announcementsMarkRead
      summary: 标记公告已读
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::markRead'
      x-permission: authenticated
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/announcements/{announcement_id}/read-stats:
    get:
      operationId: announcementsReadStats
      summary: 公告已读统计
      tags: [announcements]
      x-handler: 'Sandadmin\Http\AnnouncementController::readStats'
      x-permission: system:announcement:index
      x-error-codes: [ANNOUNCEMENT_NOT_FOUND]
      parameters:
        - {name: announcement_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 契约信封}}

  # ── 消息中心 ──
  /api/admin/v1/notifications/unread-count:
    get:
      operationId: notificationsUnreadCount
      summary: 未读消息数
      tags: [notifications]
      x-handler: 'Sandadmin\Http\NotificationController::unreadCount'
      x-permission: authenticated
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/notifications/read-all:
    post:
      operationId: notificationsMarkAllRead
      summary: 全部标记已读
      tags: [notifications]
      x-handler: 'Sandadmin\Http\NotificationController::markAllRead'
      x-permission: authenticated
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/notifications:
    get:
      operationId: notificationsIndex
      summary: 消息列表
      tags: [notifications]
      x-handler: 'Sandadmin\Http\NotificationController::index'
      x-permission: authenticated
      responses: {'200': {description: 契约信封}}
  /api/admin/v1/notifications/{notification_id}/read:
    post:
      operationId: notificationsMarkRead
      summary: 标记消息已读
      tags: [notifications]
      x-handler: 'Sandadmin\Http\NotificationController::markRead'
      x-permission: authenticated
      x-error-codes: [NOT_FOUND]
      parameters:
        - {name: notification_id, in: path, required: true, schema: {type: string}}
